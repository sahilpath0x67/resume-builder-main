trigger:
  branches:
    include:
      - main
      - master

variables:
  imageName: 'nepastra/nepastra-cv-web'
  DOCKER_HUB_CONNECTION: 'nepastra-docker-hub'
  VPS_CONNECTION: 'nepastra-vps-ssh'
  TAG: '$(Build.BuildId)'

pool:
  vmImage: ubuntu-latest

stages:
  # -------------------------------
  # Stage 1: Docker Build & Push
  # (Next.js build runs inside Docker multi-stage)
  # -------------------------------
  - stage: DockerBuildAndPush
    displayName: Docker Build & Push
    jobs:
      - job: BuildAndPushDocker
        displayName: Build & Push Docker Image
        steps:
          - checkout: self
            fetchDepth: 1

          # Login to Docker Hub
          - task: Docker@2
            displayName: Login to Docker Hub
            inputs:
              command: login
              containerRegistry: $(DOCKER_HUB_CONNECTION)

          # Build and push Docker image (multi-stage: deps → build → runner)
          - task: Docker@2
            displayName: Build & Push Image
            inputs:
              command: buildAndPush
              repository: $(imageName)
              dockerfile: 'Dockerfile'
              buildContext: '.'
              tags: |
                $(TAG)
                latest

  # -------------------------------
  # Stage 2: Deploy to VPS
  # -------------------------------
  - stage: Deploy
    displayName: Deploy to VPS
    dependsOn: DockerBuildAndPush
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: Deploy via SSH
        steps:
          - task: SSH@0
            inputs:
              sshEndpoint: $(VPS_CONNECTION)
              runOptions: inline
              inline: |
                BUILD_ID=$(Build.BuildId)
                IMAGE="nepastra/nepastra-cv-web:$BUILD_ID"
                COMPOSE_FILE=/opt/apps/docker-compose.yml

                echo "Pulling image $IMAGE..."
                docker pull $IMAGE

                echo "Updating docker-compose.yml..."
                sed -i "s|nepastra/nepastra-cv-web:.*|$IMAGE|" $COMPOSE_FILE

                echo "Deploying NepAstra CV Web..."
                docker compose -f $COMPOSE_FILE up -d --no-build nepastra-cv-web 2>/dev/null || true

                docker ps | grep nepastra-cv-web
